name: Deploy

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      ci_run_id:
        description: Successful CI run that produced the wheel
        required: true
        type: string
      commit_sha:
        description: Commit tested by the originating CI run
        required: true
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy wheel to server
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    runs-on: [self-hosted, linux, deploy]

    steps:
      - name: Skip if not latest main commit
        id: latest
        env:
          RUN_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_MAIN_SHA="$(git ls-remote https://github.com/brandstaetter/Taskmanagement-App.git refs/heads/main | awk '{print $1}')"
          if [ "$LATEST_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "Skipping deploy: workflow_run SHA is not the latest main SHA"
            echo "LATEST_MAIN_SHA=$LATEST_MAIN_SHA"
            echo "RUN_SHA=$RUN_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Clean wheel artifact directory
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./wheel
          mkdir -p ./wheel

      - name: Download wheel artifact
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: ./wheel
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Deploy
        if: steps.latest.outputs.deploy == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(./wheel/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel artifact, found ${#wheels[@]}"
            ls -la ./wheel || true
            exit 1
          fi
          WHEEL_PATH="${wheels[0]}"
          sudo /opt/taskmanagement-app/deploy/deploy-wheel.sh "$WHEEL_PATH"

  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: [self-hosted, deploy]
    needs: [deploy]
    if: needs.deploy.outputs.deployed == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Verify Python 3.14
        run: python3.14 --version

      - name: Install poetry
        run: |
          python3.14 -m pip install --user poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup a local virtual environment (if no poetry.toml file)
        run: |
          poetry env use python3.14
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - uses: actions/cache@v5
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./.venv
          key: smoke-venv-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Run smoke tests against deployed environment
        env:
          E2E_BASE_URL: ${{ secrets.DEPLOY_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: poetry run pytest tests/e2e/ -m smoke -v --tb=short

      - name: Cleanup caches
        if: always()
        run: |
          rm -rf ~/.cache/pip/* 2>/dev/null || true
          rm -rf ~/.cache/pypoetry/cache/* 2>/dev/null || true
          rm -rf ~/.cache/pypoetry/artifacts/* 2>/dev/null || true
